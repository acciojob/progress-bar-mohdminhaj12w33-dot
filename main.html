
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Bar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 700px;
            padding: 30px;
        }

        .progress-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            margin-bottom: 40px;
        }

        .progress-line {
            height: 5px;
            width: 100%;
            background-color: lightgray;
            position: absolute;
            z-index: 0;
        }

        .progress {
            height: 5px;
            width: 0%;
            background-color: green;
            position: absolute;
            z-index: 0;
            transition: width 0.3s ease;
        }

        .circle {
            height: 60px;
            width: 60px;
            border: 3px solid lightgray;
            border-radius: 50%;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            font-size: 20px;
            transition: border-color 0.3s;
        }

        .circle.active {
            border-color: green;
            background-color: green;
            color: white;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            background-color: green;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:disabled {
            background-color: gray;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="progress-container">

            <div class="progress-line"></div>
            <div class="progress" id="progress"></div>

            <div class="circle active" id="circle-1">1</div>
            <div class="circle" id="circle-2">2</div>
            <div class="circle" id="circle-3">3</div>
            <div class="circle" id="circle-4">4</div>
            <div class="circle" id="circle-5">5</div>

        </div>

        <div class="buttons">
            <button id="prev" disabled>Previous</button>
            <button id="next">Next</button>
        </div>

    </div>

<script>

    let currentStep = 1;

    const next = document.getElementById("next");
    const prev = document.getElementById("prev");
    const progress = document.getElementById("progress");

    const circles = document.querySelectorAll(".circle");

    function updateProgress() {

        circles.forEach((circle, index) => {

            if (index < currentStep) {
                circle.classList.add("active");
            }
            else {
                circle.classList.remove("active");
            }

        });

        progress.style.width = ((currentStep - 1) / 4) * 100 + "%";

        prev.disabled = currentStep === 1;

        next.disabled = currentStep === 5;

    }

    next.addEventListener("click", function() {

        if (currentStep < 5) {
            currentStep++;
        }

        updateProgress();

    });

    prev.addEventListener("click", function() {

        if (currentStep > 1) {
            currentStep--;
        }

        updateProgress();

    });

</script>

</body>
</html>
